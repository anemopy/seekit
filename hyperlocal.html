<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="SeekIt — Hyperlocal Market. Fresh homemade pickles, river fish food, handcrafted cotton pillows, and village cottage goods across Malkangiri district under 30 km." />
  <title>Hyperlocal Market — SeekIt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/webp" href="logo.webp" />
</head>

<body>
  <div id="app">
    <!-- App Header Gradient -->
    <header class="app-header-gradient">
      <!-- Top Navigation Row -->
      <div class="header-top-brand-row">
        <!-- Left: Back Button -->
        <a href="index.html" class="header-icon-btn" aria-label="Back to Home" title="Back to Home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </a>

        <!-- Center: Logo & Brand -->
        <a href="index.html" class="header-brand-title" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 0;">
          <img src="logo.png" alt="SeekIt Logo" style="height: 34px; width: auto; object-fit: contain; margin: 0; padding: 0;" />
          <span>SeekIt</span>
        </a>

        <!-- Right: Reserved & Cart Buttons -->
        <div style="display: flex; align-items: center; gap: 8px;">
          <a href="reservedproducts.html" class="header-icon-btn" id="btn-top-reserved" aria-label="Reserved Products" title="Reserved Products">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
              <polyline points="9 14 11 16 15 11"></polyline>
            </svg>
            <span class="header-cart-badge" id="top-reserved-badge" style="display: none;">0</span>
          </a>

          <a href="cart.html" class="header-icon-btn" id="btn-top-cart" aria-label="Cart" title="Your Cart">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <span class="header-cart-badge" id="top-cart-badge" style="display: none;">0</span>
          </a>
        </div>
      </div>

      <!-- Title & Subtitle -->
      <div class="app-header-title-wrap" style="margin-top: 4px; margin-bottom: 2px;">
        <h1 class="app-header-title">Hyperlocal Market</h1>
        <p class="app-header-subtitle">Malkangiri District Villages • Direct Delivery & Pickup (Under 30 km)</p>
      </div>
    </header>

    <!-- Curved Main Content Sheet -->
    <main class="curved-sheet-content">
      <!-- Fixed Sticky Filter & Search Area -->
      <div class="sheet-sticky-header" style="padding-bottom: 10px;">
        <!-- Location radius badge -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
          <div style="display: flex; align-items: center; gap: 5px; font-size: 0.8rem; font-weight: 700; color: var(--ink);">
            <span style="color: var(--crimson);">📍</span>
            <span>Malkangiri Rural Belt</span>
          </div>
          <span style="font-size: 0.72rem; font-weight: 800; color: #059669; background: rgba(5, 150, 105, 0.1); padding: 3px 8px; border-radius: var(--r-pill); border: 1px solid rgba(5, 150, 105, 0.25);">
            ⚡ Max 30 km Radius
          </span>
        </div>

        <!-- Pill Search Bar -->
        <div class="search-pill-container" style="margin-bottom: 2px;">
          <svg class="search-pill-left-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" class="search-pill-input" id="hyperlocal-search-input" placeholder="Search honey, clay pots, pillows, pickles, ghee, baskets..." autocomplete="off" />
        </div>
      </div>

      <!-- Live Hyperlocal Products Feed -->
      <section class="home-products-section" style="padding-top: 4px;">
        <div class="section-header-row" style="margin-bottom: 10px;">
          <h3 class="section-heading-title" id="hyperlocal-feed-title">Direct from Village Makers</h3>
          <span style="font-size: 0.78rem; font-weight: 700; color: #6B7280;" id="hyperlocal-feed-count">18 Products</span>
        </div>

        <!-- Populated dynamically by app.js -->
        <div class="products-grid" id="hyperlocal-products-grid"></div>
      </section>
    </main>

    <!-- Bottom Navigation (5 Tabs - Hyperlocal Active) -->
    <nav class="bottom-nav">
      <a class="nav-item" href="index.html" id="nav-home">
        <div class="nav-icon-container">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
          </svg>
        </div>
        <span class="nav-label">Home</span>
      </a>

      <a class="nav-item" href="categories.html" id="nav-categories">
        <div class="nav-icon-container">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="3" width="7" height="7" rx="1.5" />
            <rect x="3" y="14" width="7" height="7" rx="1.5" />
            <rect x="14" y="14" width="7" height="7" rx="1.5" />
          </svg>
        </div>
        <span class="nav-label">Categories</span>
      </a>

      <!-- Center Bottom Tab: Hyperlocal Market (Active) -->
      <a class="nav-item active" href="hyperlocal.html" id="nav-hyperlocal">
        <div class="nav-icon-container">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
            <line x1="3" y1="6" x2="21" y2="6" />
            <path d="M16 10a4 4 0 0 1-8 0" />
          </svg>
        </div>
        <span class="nav-label">Hyperlocal</span>
      </a>

      <a class="nav-item" href="shops.html" id="nav-shops">
        <div class="nav-icon-container">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <path d="M9 22V12h6v10" />
          </svg>
        </div>
        <span class="nav-label">Shops</span>
      </a>

      <a class="nav-item" href="account.html" id="nav-account">
        <div class="nav-icon-container">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        </div>
        <span class="nav-label">Account</span>
      </a>
    </nav>
  </div>

  <script src="app.js"></script>
</body>

</html>
