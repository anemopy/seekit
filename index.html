<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="SeekIt — Find it nearby. Buy it locally. Discover products available at nearby local shops." />
  <title>SeekIt — Find it nearby. Buy it locally.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/webp" href="logo.webp" />
</head>

<body>
  <div id="app">
    <!-- App Header Gradient -->
    <header class="app-header-gradient">
      <!-- Top Bar: Account (Left), Logo (Center), Cart (Right) -->
      <div class="header-top-brand-row">
        <!-- Top Left: Account Button -->
        <a href="account.html" class="header-icon-btn" id="btn-top-account" aria-label="Account" title="My Account">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </a>

        <!-- Center: Logo & Brand -->
        <a href="index.html" class="header-brand-title" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 0;">
          <img src="logo.png" alt="SeekIt Logo" style="height: 36px; width: auto; object-fit: contain; margin: 0; padding: 0;" />
          <span>SeekIt</span>
        </a>

        <!-- Top Right: Reserved Products & Cart Buttons -->
        <div style="display: flex; align-items: center; gap: 8px;">
          <!-- Reserved Products Button (on left of Cart) -->
          <a href="reservedproducts.html" class="header-icon-btn" id="btn-top-reserved" aria-label="Reserved Products" title="Reserved Products">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
              <polyline points="9 14 11 16 15 11"></polyline>
            </svg>
            <span class="header-cart-badge" id="top-reserved-badge" style="display: none;">0</span>
          </a>

          <!-- Cart Button -->
          <a href="cart.html" class="header-icon-btn" id="btn-top-cart" aria-label="Cart" title="Your Cart">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <span class="header-cart-badge" id="top-cart-badge" style="display: none;">0</span>
          </a>
        </div>
      </div>
    </header>

    <!-- Curved Main Content Sheet -->
    <main class="curved-sheet-content">
      <!-- Fixed Sticky Header: Location & Search Bar -->
      <div class="home-sticky-header">
        <!-- Location & Distance Radius Row -->
        <div class="home-location-bar">
          <button class="location-dropdown-btn" id="location-btn">
            <svg class="loc-pin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
              <circle cx="12" cy="10" r="3" />
            </svg>
            <span id="location-text">Malkangiri, Odisha</span>
            <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </button>
        </div>

        <!-- Pill Search Bar with Red Circle Search Button -->
        <div class="search-pill-container" id="search-bar">
          <svg class="search-pill-left-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" class="search-pill-input" id="search-input" placeholder="Search for products, shops..." autocomplete="off" />
          <button class="search-pill-btn" id="search-btn" aria-label="Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Live Nearby Products Feed -->
      <section class="home-products-section">
        <div class="section-header-row" style="margin-bottom: 12px;">
          <h3 class="section-heading-title" id="home-feed-title">Available Near You</h3>
          <span style="font-size: 0.78rem; font-weight: 700; color: #6B7280;" id="home-feed-count">50 Products</span>
        </div>

        <div class="products-grid" id="home-products-grid">
          <!-- Populated dynamically from SELLERS_DB in app.js -->
        </div>
      </section>
    </main>

    <!-- Location Picker Modal -->
    <div class="modal-overlay" id="location-modal">
      <div class="modal-sheet">
        <div class="modal-handle"></div>
        <h3 class="modal-title">Set your location</h3>

        <div class="modal-option">
          <label class="modal-label" for="pincode-input" style="font-size: 0.84rem; font-weight: 700; color: var(--ink); display: block; margin-bottom: 6px;">Enter Pincode</label>
          <div class="pincode-row">
            <input type="text" class="pincode-input" id="pincode-input" placeholder="e.g. 764020 or 764045" maxlength="6" inputmode="numeric" />
            <button class="btn-primary" id="pincode-submit">Go</button>
          </div>
        </div>

        <div class="modal-divider">
          <span>or</span>
        </div>

        <button class="btn-outline" id="fetch-location-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px;">
            <circle cx="12" cy="12" r="10" />
            <circle cx="12" cy="12" r="3" />
            <line x1="12" y1="2" x2="12" y2="6" />
            <line x1="12" y1="18" x2="12" y2="22" />
            <line x1="2" y1="12" x2="6" y2="12" />
            <line x1="18" y1="12" x2="22" y2="12" />
          </svg>
          Use my current location
        </button>

        <p class="modal-status" id="location-status" style="font-size: 0.8rem; text-align: center; margin-top: 10px;"></p>
      </div>
    </div>

    <!-- Ask Nearby Shops Modal -->
    <div class="modal-overlay" id="ask-modal">
      <div class="modal-sheet">
        <div class="modal-handle"></div>
        <h3 class="modal-title">Ask Nearby Shops</h3>
        <p style="font-size: 0.85rem; color: #6B7280; margin-bottom: 14px;">Can't find a product in store catalogs? Broadcast an inquiry to all verified local shopkeepers.</p>
        
        <div style="margin-bottom: 12px;">
          <label style="font-size: 0.82rem; font-weight: 700; color: var(--ink); display: block; margin-bottom: 4px;">Item / Product Name</label>
          <input type="text" id="ask-product-name" class="pincode-input" style="width:100%;" placeholder="e.g. Amul Gold Milk 1L or USB-C Cable" />
        </div>

        <div style="margin-bottom: 16px;">
          <label style="font-size: 0.82rem; font-weight: 700; color: var(--ink); display: block; margin-bottom: 4px;">Category</label>
          <select id="ask-category-select" class="pincode-input" style="width:100%; background: #fff;">
            <option value="Grocery">Grocery & Daily Needs</option>
            <option value="Electronics">Electronics & Mobiles</option>
            <option value="Stationery">Stationery & Books</option>
            <option value="Hardware">Hardware & Tools</option>
            <option value="Personal Care">Personal Care</option>
          </select>
        </div>

        <button class="btn-primary" id="btn-submit-ask" style="width:100%; height: 48px;">Broadcast to Nearby Shops</button>
      </div>
    </div>

    <!-- Bottom Navigation (5 Tabs) -->
    <nav class="bottom-nav">
      <a class="nav-item active" href="index.html" id="nav-home">
        <div class="nav-icon-container">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
          </svg>
        </div>
        <span class="nav-label">Home</span>
      </a>

      <a class="nav-item" href="categories.html" id="nav-categories">
        <div class="nav-icon-container">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="3" width="7" height="7" rx="1.5" />
            <rect x="3" y="14" width="7" height="7" rx="1.5" />
            <rect x="14" y="14" width="7" height="7" rx="1.5" />
          </svg>
        </div>
        <span class="nav-label">Categories</span>
      </a>

      <a class="nav-item" href="hyperlocal.html" id="nav-hyperlocal">
        <div class="nav-icon-container">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
            <line x1="3" y1="6" x2="21" y2="6" />
            <path d="M16 10a4 4 0 0 1-8 0" />
          </svg>
        </div>
        <span class="nav-label">Hyperlocal</span>
      </a>

      <a class="nav-item" href="shops.html" id="nav-shops">
        <div class="nav-icon-container">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l1-4h16l1 4" />
            <path d="M3 9v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V9" />
            <path d="M9 21V13h6v8" />
            <path d="M3 9h18" />
          </svg>
        </div>
        <span class="nav-label">Shops</span>
      </a>

      <a class="nav-item" href="account.html" id="nav-profile">
        <div class="nav-icon-container">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        </div>
        <span class="nav-label">Account</span>
      </a>
    </nav>
  </div>

  <div id="toast-container"></div>
  <script src="app.js"></script>
</body>

</html>
