<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="SeekIt — Sign in to your account." />
  <title>Customer Sign In — SeekIt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/webp" href="logo.webp" />
</head>

<body>
  <div id="app">
    <!-- App Header Gradient -->
    <header class="app-header-gradient" style="padding-bottom: 36px;">
      <!-- Centered Logo & Brand -->
      <div class="header-top-brand-row" style="justify-content: center;">
        <a href="index.html" class="header-brand-title" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 0;">
          <img src="logo.png" alt="SeekIt Logo" style="height: 36px; width: auto; object-fit: contain; margin: 0; padding: 0;" />
          <span>SeekIt</span>
        </a>
      </div>

      <div class="app-header-title-wrap" style="text-align: center; margin-top: 6px; margin-bottom: 0;">
        <h1 class="app-header-title" style="font-size: 1.5rem;">Customer Sign In</h1>
        <p class="app-header-subtitle">Manage local orders & store pickup reservations</p>
      </div>
    </header>

    <!-- Curved Main Content Sheet -->
    <main class="curved-sheet-content">
      <div class="login-card fade-in">
        <div id="login-alert" class="login-alert"></div>

        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="login-email">Email Address</label>
            <div class="input-wrapper">
              <input type="email" id="login-email" class="input-field" placeholder="e.g. aarav@mail.com" required autocomplete="email" />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <div class="input-wrapper">
              <input type="password" id="login-password" class="input-field" placeholder="Enter your password" required autocomplete="current-password" />
              <button type="button" id="toggle-password-btn" class="input-toggle-btn" aria-label="Toggle password visibility">
                <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-submit" id="btn-login-submit" style="margin-top: 8px;">Sign In</button>
        </form>

        <div style="text-align: center; margin-top: 18px; padding-top: 14px; border-top: 1px solid #F3F4F6;">
          <a href="seller-login.html" style="font-size: 0.84rem; font-weight: 700; color: var(--crimson); text-decoration: none; display: inline-flex; align-items: center; gap: 4px;">
            🏪 Are you a shopkeeper? Sign in as Seller →
          </a>
        </div>
      </div>

      <!-- Quick Demo Accounts for Testing -->
      <div class="demo-accounts-section">
        <p class="demo-title">⚡ Quick Tap to Fill Demo Accounts</p>
        <div class="demo-chips" id="demo-chips-container">
          <!-- Populated dynamically from USERS_DB in app.js -->
        </div>
      </div>
    </main>

    <!-- Bottom Navigation (5 Tabs) -->
    <nav class="bottom-nav">
      <a class="nav-item" href="index.html" id="nav-home">
        <div class="nav-icon-container">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
          </svg>
        </div>
        <span class="nav-label">Home</span>
      </a>

      <a class="nav-item" href="categories.html" id="nav-categories">
        <div class="nav-icon-container">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="3" width="7" height="7" rx="1.5" />
            <rect x="3" y="14" width="7" height="7" rx="1.5" />
            <rect x="14" y="14" width="7" height="7" rx="1.5" />
          </svg>
        </div>
        <span class="nav-label">Categories</span>
      </a>

      <a class="nav-item" href="cart.html" id="nav-cart">
        <div class="nav-icon-container">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1" />
            <circle cx="20" cy="21" r="1" />
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
          </svg>
        </div>
        <span class="nav-label">Cart</span>
      </a>

      <a class="nav-item" href="shops.html" id="nav-shops">
        <div class="nav-icon-container">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l1-4h16l1 4" />
            <path d="M3 9v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V9" />
            <path d="M9 21V13h6v8" />
            <path d="M3 9h18" />
          </svg>
        </div>
        <span class="nav-label">Shops</span>
      </a>

      <a class="nav-item active" href="account.html" id="nav-profile">
        <div class="nav-icon-container">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        </div>
        <span class="nav-label">Account</span>
      </a>
    </nav>
  </div>

  <div id="toast-container"></div>
  <script src="app.js"></script>
</body>

</html>
