<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="SeekIt — Discover nearby local shops and what they have in stock." />
  <title>Shops Near You — SeekIt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/webp" href="logo.webp" />
</head>

<body>
  <div id="app">
    <!-- App Header Gradient -->
    <header class="app-header-gradient">
      <!-- Title, Subtitle & Action Group -->
      <div class="header-top-brand-row" style="margin-bottom: 12px; align-items: flex-start;">
        <div>
          <h1 class="app-header-title" id="shops-page-title" style="margin: 0; font-size: 1.45rem;">Shops Near You</h1>
          <p class="app-header-subtitle" id="shops-page-subtitle" style="margin-top: 2px;">Fresh products. Local shops.</p>
        </div>

        <!-- Top Right: Reserved Products & Cart Buttons -->
        <div style="display: flex; align-items: center; gap: 8px;">
          <!-- Reserved Products Button -->
          <a href="reservedproducts.html" class="header-icon-btn" id="btn-top-reserved" aria-label="Reserved Products" title="Reserved Products">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
              <polyline points="9 14 11 16 15 11"></polyline>
            </svg>
            <span class="header-cart-badge" id="top-reserved-badge" style="display: none;">0</span>
          </a>

          <!-- Cart Button -->
          <a href="cart.html" class="header-icon-btn" id="btn-top-cart" aria-label="Cart" title="Your Cart">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <span class="header-cart-badge" id="top-cart-badge" style="display: none;">0</span>
          </a>
        </div>
      </div>

      <!-- Control Pills: Location Dropdown + Filter -->
      <div class="app-header-controls">
        <button class="app-header-pill" id="btn-shops-change-loc">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
            <circle cx="12" cy="10" r="3" />
          </svg>
          <span id="shops-location-text">Malkangiri, Odisha</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 12px; height: 12px; margin-left: 2px;">
            <polyline points="6 9 12 15 18 9" />
          </svg>
        </button>

        <button class="app-header-pill filter-btn" id="btn-shops-filter">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="21" x2="4" y2="14"></line>
            <line x1="4" y1="10" x2="4" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12" y2="3"></line>
            <line x1="20" y1="21" x2="20" y2="16"></line>
            <line x1="20" y1="12" x2="20" y2="3"></line>
            <line x1="1" y1="14" x2="7" y2="14"></line>
            <line x1="9" y1="8" x2="15" y2="8"></line>
            <line x1="17" y1="16" x2="23" y2="16"></line>
          </svg>
          Filter
        </button>
      </div>
    </header>

    <!-- Curved Main Content Sheet -->
    <main class="curved-sheet-content">
      <!-- Fixed Sticky Header: Search inside shops -->
      <div class="sheet-sticky-header">
        <div class="search-pill-container" style="margin-bottom: 0;">
          <svg class="search-pill-left-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" class="search-pill-input" id="shops-search-input" placeholder="Search store name, category, or area..." autocomplete="off" />
        </div>
      </div>

      <!-- Shops List Container -->
      <div id="shops-container" class="shops-list">
        <!-- Dynamically rendered by app.js matching the exact card UI in Screenshot 1 -->
      </div>
    </main>

    <!-- Filter Bottom Sheet Modal -->
    <div class="modal-overlay" id="filter-modal">
      <div class="modal-sheet">
        <div class="modal-handle"></div>
        <h3 class="modal-title">Filter Shops</h3>

        <div style="margin-bottom: 16px;">
          <label style="font-size: 0.84rem; font-weight: 700; color: var(--ink); display: block; margin-bottom: 8px;">Store Status</label>
          <div style="display: flex; gap: 8px;">
            <button class="chip active" id="filter-all-status">All Stores</button>
            <button class="chip" id="filter-open-only">🟢 Open Now Only</button>
          </div>
        </div>

        <div style="margin-bottom: 16px;">
          <label style="font-size: 0.84rem; font-weight: 700; color: var(--ink); display: block; margin-bottom: 8px;">Maximum Distance</label>
          <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button class="chip active" data-dist="any">Any Distance</button>
            <button class="chip" data-dist="1">Within 1 km</button>
            <button class="chip" data-dist="2">Within 2 km</button>
          </div>
        </div>

        <div style="margin-bottom: 20px;">
          <label style="font-size: 0.84rem; font-weight: 700; color: var(--ink); display: block; margin-bottom: 8px;">Category</label>
          <select id="filter-shop-category" class="pincode-input" style="width: 100%; background: #fff;">
            <option value="all">All Categories</option>
            <option value="Grocery">Grocery & Daily Needs</option>
            <option value="Electronics">Electronics & Mobiles</option>
            <option value="Stationery">Stationery</option>
            <option value="Hardware">Hardware & Tools</option>
          </select>
        </div>

        <button class="btn-primary" id="btn-apply-filters" style="width: 100%; height: 48px;">Apply Filters</button>
      </div>
    </div>

    <!-- Location Picker Modal -->
    <div class="modal-overlay" id="location-modal">
      <div class="modal-sheet">
        <div class="modal-handle"></div>
        <h3 class="modal-title">Set your location</h3>

        <div class="modal-option">
          <label class="modal-label" for="pincode-input" style="font-size: 0.84rem; font-weight: 700; color: var(--ink); display: block; margin-bottom: 6px;">Enter Pincode</label>
          <div class="pincode-row">
            <input type="text" class="pincode-input" id="pincode-input" placeholder="e.g. 764020 or 764045" maxlength="6" inputmode="numeric" />
            <button class="btn-primary" id="pincode-submit">Go</button>
          </div>
        </div>

        <div class="modal-divider">
          <span>or</span>
        </div>

        <button class="btn-outline" id="fetch-location-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px;">
            <circle cx="12" cy="12" r="10" />
            <circle cx="12" cy="12" r="3" />
            <line x1="12" y1="2" x2="12" y2="6" />
            <line x1="12" y1="18" x2="12" y2="22" />
            <line x1="2" y1="12" x2="6" y2="12" />
            <line x1="18" y1="12" x2="22" y2="12" />
          </svg>
          Fetch Current Location
        </button>

        <p class="location-status" id="location-status" style="font-size: 0.8rem; text-align: center; margin-top: 10px;"></p>
      </div>
    </div>

    <!-- Bottom Navigation (5 Tabs - Shops Active) -->
    <nav class="bottom-nav">
      <a class="nav-item" href="index.html" id="nav-home">
        <div class="nav-icon-container">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
          </svg>
        </div>
        <span class="nav-label">Home</span>
      </a>

      <a class="nav-item" href="categories.html" id="nav-categories">
        <div class="nav-icon-container">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="3" width="7" height="7" rx="1.5" />
            <rect x="3" y="14" width="7" height="7" rx="1.5" />
            <rect x="14" y="14" width="7" height="7" rx="1.5" />
          </svg>
        </div>
        <span class="nav-label">Categories</span>
      </a>

      <a class="nav-item" href="hyperlocal.html" id="nav-hyperlocal">
        <div class="nav-icon-container">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
            <line x1="3" y1="6" x2="21" y2="6" />
            <path d="M16 10a4 4 0 0 1-8 0" />
          </svg>
        </div>
        <span class="nav-label">Hyperlocal</span>
      </a>

      <a class="nav-item active" href="shops.html" id="nav-shops">
        <div class="nav-icon-container">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l1-4h16l1 4" />
            <path d="M3 9v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V9" />
            <path d="M9 21V13h6v8" />
            <path d="M3 9h18" />
          </svg>
        </div>
        <span class="nav-label">Shops</span>
      </a>

      <a class="nav-item" href="account.html" id="nav-profile">
        <div class="nav-icon-container">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        </div>
        <span class="nav-label">Account</span>
      </a>
    </nav>
  </div>

  <div id="toast-container"></div>
  <script src="app.js"></script>
</body>

</html>
