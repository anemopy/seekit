<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="SeekIt — Your cart. Reserve products from nearby local shops." />
  <title>Your Cart — SeekIt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/webp" href="logo.webp" />
</head>

<body>
  <div id="app">
    <!-- App Header Gradient -->
    <header class="app-header-gradient">
      <!-- Title Row -->
      <div class="cart-header-row">
        <div>
          <h1 class="app-header-title">Your Cart</h1>
          <p class="app-header-subtitle" id="cart-items-count-label">0 items</p>
        </div>
      </div>
    </header>

    <!-- Curved Main Content Sheet -->
    <main class="curved-sheet-content">
      <div class="cart-page-content" id="cart-page-container">
        <!-- Rendered dynamically by app.js matching the exact card UI in Screenshot 2 -->
      </div>
    </main>

    <!-- Bottom Navigation (5 Tabs) -->
    <nav class="bottom-nav">
      <a class="nav-item" href="index.html" id="nav-home">
        <div class="nav-icon-container">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
          </svg>
        </div>
        <span class="nav-label">Home</span>
      </a>

      <a class="nav-item" href="categories.html" id="nav-categories">
        <div class="nav-icon-container">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="3" width="7" height="7" rx="1.5" />
            <rect x="3" y="14" width="7" height="7" rx="1.5" />
            <rect x="14" y="14" width="7" height="7" rx="1.5" />
          </svg>
        </div>
        <span class="nav-label">Categories</span>
      </a>

      <a class="nav-item active" href="cart.html" id="nav-cart">
        <div class="nav-icon-container">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1" />
            <circle cx="20" cy="21" r="1" />
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
          </svg>
        </div>
        <span class="nav-label">Cart</span>
      </a>

      <a class="nav-item" href="shops.html" id="nav-shops">
        <div class="nav-icon-container">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l1-4h16l1 4" />
            <path d="M3 9v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V9" />
            <path d="M9 21V13h6v8" />
            <path d="M3 9h18" />
          </svg>
        </div>
        <span class="nav-label">Shops</span>
      </a>

      <a class="nav-item" href="account.html" id="nav-profile">
        <div class="nav-icon-container">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        </div>
        <span class="nav-label">Account</span>
      </a>
    </nav>
  </div>

  <div id="toast-container"></div>
  <script src="app.js"></script>
</body>

</html>
